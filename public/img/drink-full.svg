<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 100" shape-rendering="crispEdges">
  <rect width="64" height="100" fill="#13132d"/>
  <!-- Glass body -->
  <rect x="16" y="20" width="32" height="60" fill="#d4873a" stroke="#8ab4d6" stroke-width="2"/>
  <!-- Glass rim -->
  <rect x="14" y="18" width="36" height="4" fill="#8ab4d6"/>
  <!-- Glass base -->
  <rect x="18" y="80" width="28" height="4" fill="#8ab4d6"/>
  <!-- Ice cubes -->
  <rect x="22" y="40" width="8" height="8" fill="#e8a94a" opacity="0.7"/>
  <rect x="34" y="50" width="8" height="8" fill="#e8a94a" opacity="0.7"/>
  <!-- Cherry -->
  <circle cx="26" cy="22" r="4" fill="#cc3333"/>
  <line x1="26" y1="18" x2="28" y2="12" stroke="#553322" stroke-width="1.5"/>
  <!-- Lemon slice -->
  <circle cx="44" cy="20" r="6" fill="#eec44a" stroke="#cc9922" stroke-width="1"/>
  <line x1="44" y1="14" x2="44" y2="26" stroke="#cc9922" stroke-width="0.5"/>
  <line x1="38" y1="20" x2="50" y2="20" stroke="#cc9922" stroke-width="0.5"/>
  <!-- Highlight -->
  <rect x="20" y="28" width="3" height="20" fill="rgba(255,255,255,0.2)"/>
</svg>

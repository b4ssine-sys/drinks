<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges">
  <!-- Straw -->
  <rect x="34" y="0" width="3" height="20" fill="#ff2d7b"/>
  <rect x="33" y="0" width="1" height="20" fill="#cc1a5e"/>

  <!-- Lid -->
  <rect x="16" y="16" width="32" height="4" fill="#e0e0e0"/>
  <rect x="16" y="16" width="32" height="1" fill="#ffffff"/>
  <rect x="16" y="19" width="32" height="1" fill="#b0b0b0"/>
  <!-- Dome top -->
  <rect x="18" y="14" width="28" height="2" fill="#d0d0d0"/>
  <rect x="20" y="13" width="24" height="1" fill="#c8c8c8"/>

  <!-- Cup body - gradient Miami Vice pink to teal -->
  <rect x="18" y="20" width="28" height="4" fill="#ff2d7b"/>
  <rect x="18" y="24" width="28" height="4" fill="#ff1a6e"/>
  <rect x="19" y="28" width="26" height="4" fill="#e8156a"/>
  <rect x="19" y="32" width="26" height="4" fill="#cc1a5e"/>
  <rect x="20" y="36" width="24" height="4" fill="#aa1a55"/>
  <rect x="20" y="40" width="24" height="4" fill="#881a4a"/>
  <rect x="21" y="44" width="22" height="4" fill="#6a1a42"/>
  <rect x="21" y="48" width="22" height="4" fill="#551a3a"/>

  <!-- Cup taper bottom -->
  <rect x="22" y="52" width="20" height="3" fill="#441a35"/>
  <rect x="23" y="55" width="18" height="2" fill="#3a1530"/>
  <rect x="24" y="57" width="16" height="2" fill="#331230"/>

  <!-- Cup bottom edge -->
  <rect x="24" y="59" width="16" height="2" fill="#b0b0b0"/>

  <!-- DD stripe band -->
  <rect x="18" y="22" width="28" height="1" fill="#ff6b00"/>
  <rect x="19" y="30" width="26" height="1" fill="#ff6b00"/>

  <!-- Retro Japanese wave pattern on cup -->
  <rect x="20" y="26" width="2" height="2" fill="#00e5cc"/>
  <rect x="24" y="26" width="2" height="2" fill="#00e5cc"/>
  <rect x="28" y="26" width="2" height="2" fill="#00e5cc"/>
  <rect x="32" y="26" width="2" height="2" fill="#00e5cc"/>
  <rect x="36" y="26" width="2" height="2" fill="#00e5cc"/>
  <rect x="40" y="26" width="2" height="2" fill="#00e5cc"/>
  <rect x="22" y="27" width="2" height="1" fill="#00ccb8"/>
  <rect x="26" y="27" width="2" height="1" fill="#00ccb8"/>
  <rect x="30" y="27" width="2" height="1" fill="#00ccb8"/>
  <rect x="34" y="27" width="2" height="1" fill="#00ccb8"/>
  <rect x="38" y="27" width="2" height="1" fill="#00ccb8"/>

  <!-- "DD" pixel text on cup -->
  <!-- D #1 -->
  <rect x="24" y="34" width="1" height="7" fill="#ffd700"/>
  <rect x="25" y="34" width="2" height="1" fill="#ffd700"/>
  <rect x="25" y="40" width="2" height="1" fill="#ffd700"/>
  <rect x="27" y="35" width="1" height="5" fill="#ffd700"/>

  <!-- D #2 -->
  <rect x="30" y="34" width="1" height="7" fill="#ffd700"/>
  <rect x="31" y="34" width="2" height="1" fill="#ffd700"/>
  <rect x="31" y="40" width="2" height="1" fill="#ffd700"/>
  <rect x="33" y="35" width="1" height="5" fill="#ffd700"/>

  <!-- Ice cubes visible through cup (translucent effect) -->
  <rect x="22" y="44" width="4" height="3" fill="#7a2a55" opacity="0.7"/>
  <rect x="28" y="46" width="5" height="3" fill="#7a2a55" opacity="0.7"/>
  <rect x="36" y="44" width="4" height="3" fill="#7a2a55" opacity="0.7"/>

  <!-- Liquid splash/bubbles at top -->
  <rect x="22" y="20" width="2" height="1" fill="#ff8fbf"/>
  <rect x="38" y="21" width="2" height="1" fill="#ff8fbf"/>
  <rect x="30" y="20" width="1" height="1" fill="#ff8fbf"/>

  <!-- Neon glow highlight on left edge -->
  <rect x="18" y="20" width="1" height="8" fill="#ff5a9e"/>
  <rect x="19" y="28" width="1" height="8" fill="#d4256a"/>

  <!-- Cup right shadow -->
  <rect x="45" y="20" width="1" height="8" fill="#cc1050"/>
  <rect x="44" y="28" width="1" height="8" fill="#990e40"/>

  <!-- Condensation drops -->
  <rect x="42" y="32" width="1" height="2" fill="#66d9cc" opacity="0.5"/>
  <rect x="20" y="38" width="1" height="2" fill="#66d9cc" opacity="0.5"/>
  <rect x="41" y="42" width="1" height="1" fill="#66d9cc" opacity="0.5"/>
</svg>
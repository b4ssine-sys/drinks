<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 100" shape-rendering="crispEdges">
  <!-- Frame 1: Full drink (0-64) -->
  <rect width="64" height="100" fill="#13132d"/>
  <rect x="16" y="20" width="32" height="60" fill="#d4873a" stroke="#8ab4d6" stroke-width="2"/>
  <rect x="14" y="18" width="36" height="4" fill="#8ab4d6"/>
  <rect x="18" y="80" width="28" height="4" fill="#8ab4d6"/>
  <rect x="22" y="40" width="8" height="8" fill="#e8a94a" opacity="0.7"/>
  <rect x="34" y="50" width="8" height="8" fill="#e8a94a" opacity="0.7"/>
  <circle cx="26" cy="22" r="4" fill="#cc3333"/>
  <line x1="26" y1="18" x2="28" y2="12" stroke="#553322" stroke-width="1.5"/>
  <circle cx="44" cy="20" r="6" fill="#eec44a" stroke="#cc9922" stroke-width="1"/>
  <rect x="20" y="28" width="3" height="20" fill="rgba(255,255,255,0.2)"/>

  <!-- Frame 2: Empty glass (64-128) -->
  <rect x="64" width="64" height="100" fill="#13132d"/>
  <rect x="82" y="20" width="28" height="60" fill="rgba(138,180,214,0.15)" stroke="#6b8a9e" stroke-width="2"/>
  <rect x="80" y="18" width="32" height="4" fill="#6b8a9e"/>
  <rect x="84" y="80" width="24" height="4" fill="#6b8a9e"/>
  <rect x="88" y="40" width="2" height="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="100" y="52" width="2" height="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="94" y="62" width="2" height="3" fill="rgba(255,255,255,0.3)"/>
  <rect x="86" y="28" width="3" height="20" fill="rgba(255,255,255,0.1)"/>
</svg>
